name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  database:
    name: Database (RLS + business rules)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and run the suite
        env:
          PGPASSWORD: postgres
        run: scripts/db_test.sh -h localhost -p 5432 -U postgres

  swift-static-check:
    name: Swift static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/swift_check.py

  ios-build:
    name: iOS build and tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      # The package targets iOS, so it is built for the simulator SDK rather
      # than for the host. This is the step that has never run: everything in
      # ios/ was written without a compiler.
      - name: Build
        working-directory: ios
        # pipefail is load-bearing: without it xcpretty's exit code hides
        # xcodebuild's, and a failed build reports success. It did exactly
        # that on the first run.
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme EnergyCourtage \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      - name: Test
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme EnergyCourtage \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  integration:
    name: iOS client against a real PostgREST
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Postgres and PostgREST both have Homebrew formulae, so this needs no
      # Docker -- which matters, because macOS runners cannot run it.
      - name: Install Postgres and PostgREST
        run: |
          brew install postgresql@16 postgrest
          echo "/opt/homebrew/opt/postgresql@16/bin" >> $GITHUB_PATH

      - name: Start Postgres
        run: |
          initdb -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust
          pg_ctl -D "$RUNNER_TEMP/pgdata" -o "-p 5432" -l "$RUNNER_TEMP/pg.log" start
          for i in $(seq 1 30); do pg_isready -p 5432 && break; sleep 1; done
          createdb -p 5432 -U postgres energy_courtage

      - name: Apply schema and seed
        run: |
          set -euo pipefail
          psql -p 5432 -U postgres -d energy_courtage -v ON_ERROR_STOP=1 \
               -q -f supabase/local/00_auth_shim.sql
          for f in supabase/migrations/*.sql; do
            psql -p 5432 -U postgres -d energy_courtage -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -p 5432 -U postgres -d energy_courtage -v ON_ERROR_STOP=1 \
               -q -f supabase/local/01_postgrest_roles.sql
          psql -p 5432 -U postgres -d energy_courtage -q -c "
            insert into auth.users(id,email) values
              ('11111111-1111-1111-1111-111111111111','johann@example.test'),
              ('22222222-2222-2222-2222-222222222222','marie@example.test'),
              ('33333333-3333-3333-3333-333333333333','pierre-louis@trinity-energie.test')
            on conflict do nothing;"
          psql -p 5432 -U postgres -d energy_courtage -v ON_ERROR_STOP=1 \
               -q -f supabase/seed/demo.sql

      - name: Start PostgREST
        env:
          JWT_SECRET: integration-only-secret-not-used-anywhere-else-0123456789
        run: |
          cat > "$RUNNER_TEMP/postgrest.conf" <<CONF
          db-uri = "postgres://authenticator:postgres@localhost:5432/energy_courtage"
          db-schemas = "public"
          db-anon-role = "anon"
          jwt-secret = "$JWT_SECRET"
          server-port = 3000
          CONF
          postgrest "$RUNNER_TEMP/postgrest.conf" > "$RUNNER_TEMP/postgrest.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/stages > /dev/null && break
            sleep 1
          done
          curl -sf "http://localhost:3000/stages?select=key&order=position.asc" \
            || { echo '--- postgrest log ---'; cat "$RUNNER_TEMP/postgrest.log"; exit 1; }

      # -sdk iphonesimulator here too, and for the same reason as the build
      # job: without it xcodebuild resolves the destination against the host
      # and compiles the package for macOS, where UIKit does not exist. It
      # was missing from this job alone, so the build job went green while
      # this one failed on APIs that are perfectly valid on iOS.
      - name: Run the integration tests
        working-directory: ios
        shell: bash
        env:
          # The TEST_RUNNER_ prefix is not decoration: tests run inside the
          # simulator, which inherits nothing from this shell. xcodebuild
          # forwards variables with that prefix into the test process with the
          # prefix stripped. Without it the suite skipped all 12 tests and
          # reported success.
          TEST_RUNNER_SUPABASE_TEST_URL: http://localhost:3000
          TEST_RUNNER_SUPABASE_TEST_JWT_SECRET: integration-only-secret-not-used-anywhere-else-0123456789
          # and refuse to pass by skipping
          TEST_RUNNER_REQUIRE_INTEGRATION: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme EnergyCourtage \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -only-testing:EnergyCourtageTests/IntegrationTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: PostgREST log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/postgrest.log" || true
