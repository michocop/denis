# Supabase CLI configuration.
#
# Committed rather than generated by `supabase init`, so that `supabase db
# push` finds the migrations next to it and nobody has to run init in the
# wrong directory and wonder why nothing was applied.
#
# project_id is the ref of the linked project. It is not a secret — it is the
# subdomain of the project's public URL.

project_id = "ldfqgbjkenoloqbqdevw"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# PostgREST refuses to return more than this in one response. The app pages at
# 20, and recommendation_page enforces its own limit, so this is a backstop
# against an unbounded query rather than a working limit.
max_rows = 1000

[db]
port = 54322
# Match the hosted project, or `supabase db reset` locally diverges from what
# `db push` will do against the real one.
major_version = 15

[auth]
enabled = true
# Set to the app's scheme so password-reset links come back into the app
# rather than to a web page that does not exist.
site_url = "energycourtage://"
additional_redirect_urls = ["energycourtage://reset"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
# Sign-up is invitation-based: an account with no profile reaches no data at
# all until redeem_invite runs. Confirmation still matters, because an
# unverified address is one nobody can send an invoice to.
enable_confirmations = true
double_confirm_changes = true

# Nothing in this product needs a Google or GitHub identity.
[auth.external.google]
enabled = false
[auth.external.github]
enabled = false
[auth.external.apple]
enabled = false

[storage]
enabled = true
# Invoice PDFs. A generous ceiling would let one upload fill the free tier's
# 1 GB; an A4 attestation is a few tens of kilobytes.
file_size_limit = "5MiB"

[functions.send-push]
# The caller is the database, not a signed-in user, so there is no JWT to
# verify. The function checks PUSH_HOOK_SECRET instead.
verify_jwt = false
