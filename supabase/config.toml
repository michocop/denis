# Supabase CLI configuration.
#
# Committed rather than generated by `supabase init`, so that `supabase db
# push` finds the migrations next to it and nobody has to run init in the
# wrong directory and wonder why nothing was applied.
#
# project_id is the ref of the linked project. It is not a secret — it is the
# subdomain of the project's public URL.

project_id = "mfnauyfkhwjsxapqdtiu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# PostgREST refuses to return more than this in one response. The app pages at
# 20, and recommendation_page enforces its own limit, so this is a backstop
# against an unbounded query rather than a working limit.
max_rows = 1000

[db]
port = 54322
# Match the hosted project, or `supabase db reset` locally diverges from what
# `db push` will do against the real one.
major_version = 15

[auth]
enabled = true
enable_signup = false
# Set to the app's scheme so password-reset links come back into the app
# rather than to a web page that does not exist.
site_url = "trinityenergie://auth-callback"
additional_redirect_urls = ["trinityenergie://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# Closed. Accounts are created by inviting an address (the send-invite
# function, admins only); nobody can sign themselves up, so there is no
# sign-up form for a bot to hammer and nothing for a captcha to guard.
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
# Sign-in is by a code sent to the address (the app has no passwords). Six
# digits, as the app's code field and the SMS codes are; the hosted default
# was eight. One an hour at most a minute apart.
otp_length = 6
otp_expiry = 3600
max_frequency = "1m0s"

# Nothing in this product needs a Google or GitHub identity.
[auth.external.google]
enabled = false
[auth.external.github]
enabled = false
[auth.external.apple]
enabled = false

[storage]
enabled = true
# Invoice PDFs. A generous ceiling would let one upload fill the free tier's
# 1 GB; an A4 attestation is a few tens of kilobytes.
file_size_limit = "10MiB"

[functions.send-push]
# The caller is the database, not a signed-in user, so there is no JWT to
# verify. The function checks PUSH_HOOK_SECRET instead.
verify_jwt = false

# Auth's own emails (invitation, password reset) go through the auth-email
# function, in the brand's letterhead, via Brevo -- not Supabase's shared SMTP,
# which only reaches the project's team. scripts/deploy.sh sets the secret.
[auth.hook.send_email]
enabled = true
uri = "https://mfnauyfkhwjsxapqdtiu.supabase.co/functions/v1/auth-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"
